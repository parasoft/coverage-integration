  /v3/environments/{environmentId}/coverage/{id}:
    get:
      tags:
      - coverage
      summary: Get publish status for coverage and test results for a coverage session.
      description: Returns publish status for coverage and test result counts for
        a coverage session in this environment
      operationId: getCoverageSessionPublishStatus
      parameters:
      - name: environmentId
        in: path
        description: Unique environment identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: id
        in: path
        description: Session ID
        required: true
        schema:
          type: string
      - name: userId
        in: query
        description: User ID
        schema:
          type: string
      responses:
        "200":
          description: Operation successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverageSessionTestResultsModelV3"
        "404":
          description: Unknown environment ID or coverage session identifier.
    post:
      tags:
      - coverage
      summary: Publish all coverage data and test results for this enivronment to
        DTP.
      description: Publish all coverage data and test results collected by all coverage
        agents with active component instances in this environment to DTP
      operationId: uploadCoverage
      parameters:
      - name: environmentId
        in: path
        description: Unique environment identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: id
        in: path
        description: Session ID
        required: true
        schema:
          type: string
      - name: testConfig
        in: query
        description: Test Configuration
        schema:
          type: string
      - name: userId
        in: query
        description: User ID
        schema:
          type: string
      - name: toolName
        in: query
        description: Tool Name
        schema:
          type: string
      - name: async
        in: query
        description: Run publishing asynchronously
        schema:
          type: boolean
          default: true
      requestBody:
        description: Session tag
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoverageUploadRequestModelV3"
      responses:
        "200":
          description: Operation successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverageSessionTestResultsModelV3"
        "400":
          description: Bad request; check session tag.
        "404":
          description: Configuration issue encountered; see response message.
        "405":
          description: Using user ID in single user mode is not allowed.
        "424":
          description: Issue connecting to a Coverage Agent or DTP.
