      summary: Get an environment baseline build
      description: 'Return the baseline build identified by the specified environment
        and baseline build Id '
      operationId: getEnvironmentBaseline
      parameters:
      - name: environmentId
        in: path
        description: Unique environment identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: id
        in: path
        description: Baseline build id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Operation completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentBaselineModelV3"
        "403":
          description: License does not have Environment Management enabled
        "404":
          description: Could not find environment or baseline with specified Id
    put:
      tags:
      - coverage
      summary: Update an environment baseline build
      description: Update the specified environment baseline build. The updated builds
        in DTP that are part of the update will automatically be archived.
      operationId: updateEnvironmentBaseline
      parameters:
      - name: environmentId
        in: path
        description: Unique environment identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: id
        in: path
        description: Baseline build id
        required: true
        schema:
          type: string
      - name: unarchive
        in: query
        description: "Unarchive builds in DTP that were archived by CTP and are not\
          \ referenced by other CTP environment baselines. Warning: unarchiving builds\
          \ may interfere with some DTP reports and widgets."
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentBaselinePutModelV3"
      responses:
        "200":
          description: Operation completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentBaselineModelV3"
        "400":
          description: Invalid request body
        "401":
          description: User does not haver permissions to the specified environment
        "404":
          description: Could not find environment or baseline with specified Id
        "403":
          description: License does not have Environment Management enabled
        "424":
          description: Error connecting to DTP or managing build persistence in DTP
    post:
      tags:
      - coverage
      summary: Create an environment baseline build
