        description: Unique test scenario identifier
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Operation completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestScenarioModelV1"
        "403":
          description: License does not have API Testing enabled
        "404":
          description: Test scenario not found
  /v3/tests:
    get:
      tags:
      - tests
      summary: List all test scenarios
      description: Both name and serverName are optional but if both are used then
        the result must match both criteria. The list of test scenarios is sorted
        alphabetically by name.
      operationId: getTestScenarios
      parameters:
      - name: name
        in: query
        description: "Name of the test scenario, matches substring, case-insensitive"
        schema:
          type: string
      - name: serverName
        in: query
        description: "Name of the server where the test scenario is located, matches\
          \ substring, case-sensitive"
        schema:
          type: string
      - name: limit
        in: query
        description: Limit the number of test scenarios returned in one query
        schema:
          type: integer
          format: int32
        example: 50
      - name: offset
        in: query
        description: Return a list of test scenarios starting at this offset
        schema:
          type: integer
          format: int32
        example: 0
      responses:
        "200":
          description: Operation completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestScenarioModelListV1"
        "403":
          description: License does not have API Testing enabled
    post:
      tags:
      - tests
      summary: Register a test scenario
      description: "POST to register a test scenario.<br/><br/>application/json example:<br/><font\
        \ face=\"courier\">{<br/>&nbsp;&nbsp;&nbsp;&nbsp;\"serverId\": 1,<br/>&nbsp;&nbsp;&nbsp;&nbsp;\"\
        name\": \"A.tst\",<br/>&nbsp;&nbsp;&nbsp;&nbsp;\"filepath\": \"/TestAssets/A.tst\"\
        <br/>}</font><br/><br/>"
      operationId: registerTestScenario
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestScenarioRequestModelV2"
        required: true
      responses:
        "200":
          description: Operation completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestScenarioModelV1"
        "400":
          description: Bad request error is returned if the content parameter is missing.
        "401":
          description: Unauthorized error is returned if the server security has been
            configured and the Authorization header is not present in the request
            or does not match a user with an EM access role.
        "403":
          description: License does not have Environment Management enabled
        "404":
          description: Not found error is returned if the server ID does not match
            any registered Virtualize server.
  /v3/users/current:
    get:
      tags:
      - users
      summary: Retrieve information about the current user
      operationId: getCurrentUser
      responses:
        "200":
          description: Operation completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserModelV2"
        "401":
          description: Invalid authentication credentials
