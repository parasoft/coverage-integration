openapi: 3.0.1
info:
  title: REST API v3
  description: Generated on 2026-06-23 11:33:47
  version: v3
servers:
- url: /em/api
paths:
  /v3/environments/{environmentId}/agents/coverage:
    get:
      tags:
      - agents
      summary: Returns CTP coverage sessions in the environment for the given user.
      description: "Returns a list of all CTP coverage session IDs in the environment,\
        \ filtered by the given user ID."
      operationId: getCoverage
      parameters:
      - name: environmentId
        in: path
        description: Unique environment identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: query
        description: User ID
        schema:
          type: string
      responses:
        "200":
          description: Returns a list of CTP coverage session IDs.
        "401":
          description: User does not have permissions to modify environment.
        "403":
          description: License does not have Environment Management enabled.
        "404":
          description: Unknown environment ID.
    delete:
      tags:
      - agents
      summary: Deletes all non-active CTP coverage sessions in the environment for
        a given user.
      description: Deletes all non-active CTP coverage sessions in the environment
        using the given user ID.
      operationId: deleteCoverage
      parameters:
      - name: environmentId
        in: path
        description: Unique environment identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: query
        description: User ID
        schema:
          type: string
      responses:
        "200":
          description: Returns results of the deletion operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSessionDeletionStatusesModelV3"
        "401":
          description: User does not have permissions to modify environment.
        "403":
          description: License does not have Environment Management enabled.
        "404":
          description: Unknown environment ID.
  /v3/environments/{environmentId}/agents/coverage/{id}:
    get:
      tags:
      - agents
      summary: Returns a zipped data file of session coverage data.
      description: Returns a zipped data file of session coverage data.
      operationId: getCoverageById
      parameters:
      - name: environmentId
        in: path
        description: Unique environment identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: query
        description: User ID
        schema:
          type: string
      - name: id
        in: path
        description: Session ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Returns a zipped file of session coverage data.
        "401":
          description: User does not have permissions to modify environment
        "403":
          description: License does not have Environment Management enabled
        "404":
          description: Unknown environment ID.
        "424":
          description: Cannot connect to agent.
    delete:
      tags:
      - agents
      summary: Deletes a non-active CTP coverage session in the environment for a
        given user.
      description: Deletes a non-active CTP coverage session in the environment using
        the given session ID and user ID.
      operationId: deleteCoverageById
      parameters:
      - name: environmentId
        in: path
        description: Unique environment identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: id
        in: path
        description: Session ID
        required: true
        schema:
          type: string
      - name: userId
        in: query
        description: User ID
        schema:
          type: string
      responses:
        "200":
          description: Returns results of the deletion operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSessionDeletionStatusesModelV3"
        "401":
          description: User does not have permissions to modify environment.
        "403":
          description: License does not have Environment Management enabled.
        "404":
          description: Unknown environment ID.
  /v3/environments/{environmentId}/agents/info:
    get:
      tags:
      - agents
      summary: Returns coverage agent info.
      description: Get information about the agent mode and tool-id.
      operationId: getInfo
      parameters:
      - name: environmentId
        in: path
        description: Unique environment identifier
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Returns coverage agent info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentInfoModelV3"
        "401":
          description: User does not have permissions to modify environment
        "403":
          description: License does not have Environment Management enabled
        "404":
          description: Unknown environment ID.
        "424":
          description: Cannot connect to agent.
  /v3/environments/{environmentId}/agents/status:
    get:
      tags:
      - agents
      summary: Gets the status of the agent.
      description: "Returns the status of the agent. If the agent is in multi-user\
        \ mode, the caller must provide a userId to identify the user session. The\
        \ parallelId is used to distinguish between concurrent test executions running\
        \ in parallel for the same user."
      operationId: getStatus
      parameters:
      - name: environmentId
        in: path
        description: Unique environment identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: query
        description: User ID
        schema:
          type: string
      - name: parallelId
        in: query
        description: Parallel ID
        schema:
          type: string
      responses:
        "200":
          description: Returns agent status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatusModelV3"
        "401":
          description: User does not have permissions to modify environment
        "403":
          description: License does not have Environment Management enabled
        "404":
          description: Unknown environment ID.
        "405":
          description: Using user ID and parallel ID in single user mode is not allowed.
        "424":
          description: Cannot connect to agent.
  /v3/environments/{environmentId}/agents/users:
    get:
      tags:
      - agents
      summary: Returns a list of all known unique users.
      description: "Get a list of users from all coverage agents with active component\
        \ instances in this environment, with duplicates removed."
      operationId: getUsers
      parameters:
      - name: environmentId
        in: path
        description: Unique environment identifier
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Returns a list of unique users.
        "401":
          description: User does not have permissions to modify environment
        "403":
          description: License does not have Environment Management enabled
        "404":
          description: Unknown environment ID.
        "424":
          description: Cannot connect to agent.
  /v3/environments/{environmentId}/agents/session/start:
    get:
      tags:
      - agents
      summary: Starts a coverage session and returns the current status.
      description: Starts a new coverage session for this environment and generates
        a new session ID.
      operationId: startSessionGet
      parameters:
      - name: environmentId
        in: path
        description: Unique environment identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: query
        description: User ID
        schema:
          type: string
      responses:
        "200":
          description: The coverage session was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatusModelV3"
        "400":
          description: One or more agent URIs are invalid.
        "401":
          description: User does not have permissions to modify environment.
        "403":
          description: License does not have Environment Management enabled.
        "404":
          description: Unknown environment ID.
        "409":
          description: Session already started.
        "424":
          description: Cannot connect to agent or agent responds with error.
    post:
      tags:
      - agents
      summary: Starts a coverage session and returns the current status.
      description: Starts a new coverage session for this environment and generates
        a new session ID.
      operationId: startSessionPost
      parameters:
      - name: environmentId
        in: path
        description: Unique environment identifier
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSessionStartModelV3"
      responses:
        "200":
          description: The coverage session was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatusModelV3"
        "400":
          description: One or more agent URIs are invalid.
        "401":
          description: User does not have permissions to modify environment.
        "403":
          description: License does not have Environment Management enabled.
        "404":
          description: Unknown environment ID.
        "409":
          description: Session already started.
        "424":
          description: Cannot connect to agent or agent responds with error.
  /v3/environments/{environmentId}/agents/test/start:
    get:
      tags:
      - agents
      summary: Starts a test and returns the current status.
      description: Starts a new test for the active coverage session in this environment
        and returns the current status.
      operationId: startTestGet
      parameters:
      - name: environmentId
        in: path
        description: Unique environment identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: parallelId
        in: query
        description: "Differentiate this test from other tests which may be run in\
          \ parallel by the same user. HTTP requests to the application under tests\
          \ must include the header Baggage: test-operator-id=&lt;userId&gt;+&lt;parallelId&gt;"
        schema:
          type: string
      - name: userId
        in: query
        description: User ID
        schema:
          type: string
      - name: id
        in: query
        description: Test ID
        schema:
          type: string
      responses:
        "200":
          description: The test was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatusModelV3"
        "401":
          description: User does not have permissions to modify environment
        "403":
          description: License does not have Environment Management enabled
        "404":
          description: Unknown environment ID or no coverage agent is associated with
            the active coverage session
        "405":
          description: Using user ID in single user mode is not allowed.
        "409":
          description: No coverage session is in progress.
        "424":
          description: Cannot connect to coverage agent or coverage agent returned
            an error.
    post:
      tags:
      - agents
      summary: Starts a test and returns the current status.
      description: Starts a new test for the active coverage session in this environment
        and returns the current status.
      operationId: startTestPost
      parameters:
      - name: environmentId
        in: path
        description: Unique environment identifier
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: "Specify identifiers for test, test case, and user ID (for multi-user\
          \ mode), and optional parallel ID. A test can have associated requirements\
          \ called work items. Each work item is defined by a user-specified ID and\
          \ type, where the type must be one of the following values 'req, fr, pr,\
          \ task, test'When parallelId is specified, HTTP requests to the application\
          \ under test must include the header Baggage: test-operator-id=&lt;userId&gt;+&lt;parallelId&gt;.\
          \ The response will include the corresponding baggage value."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTestStartModelV3"
      responses:
        "200":
          description: The test was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatusModelV3"
        "401":
          description: User does not have permissions to modify environment
        "403":
          description: License does not have Environment Management enabled
        "404":
          description: Unknown environment ID or no coverage agent is associated with
            the active coverage session
        "405":
          description: Using user ID in single user mode is not allowed.
        "409":
          description: No coverage session is in progress.
        "424":
          description: Cannot connect to coverage agent or coverage agent returned
            an error.
  /v3/environments/{environmentId}/agents/test/start/{testId}:
    get:
      tags:
      - agents
      summary: Starts a test and returns the current status.
      description: Starts a new test for the active coverage session in this environment
        and returns the current status.
      operationId: startTestGetById
      parameters:
      - name: environmentId
        in: path
        description: Unique environment identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: query
        description: User ID
        schema:
          type: string
      - name: parallelId
        in: query
        description: "Differentiate this test from other tests which may be run in\
          \ parallel by the same user. HTTP requests to the application under tests\
          \ must include the header Baggage: test-operator-id=&lt;userId&gt;+&lt;parallelId&gt;"
        schema:
          type: string
      - name: testId
        in: path
        description: Test ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The test was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatusModelV3"
        "401":
          description: User does not have permissions to modify environment
        "403":
          description: License does not have Environment Management enabled
        "404":
          description: Unknown environment ID or no coverage agent is associated with
            the active coverage session
        "405":
          description: Using user ID in single user mode is not allowed.
        "409":
          description: No coverage session is in progress.
        "424":
          description: Cannot connect to coverage agent or coverage agent returned
            an error.
  /v3/environments/{environmentId}/agents/session/stop:
    get:
      tags:
      - agents
      summary: Stops the active CTP coverage session in this environment for the given
        user.
      description: Stops the active CTP coverage session in this environment for the
        given user ID.
      operationId: stopSessionGet
      parameters:
      - name: environmentId
        in: path
        description: Unique environment identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: query
        description: User ID
        schema:
          type: string
      responses:
        "200":
          description: The active CTP coverage session was stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatusModelV3"
        "401":
          description: User does not have permissions to modify environment.
        "403":
          description: License does not have Environment Management enabled.
        "404":
          description: Unknown environment ID.
        "409":
          description: Cannot stop CTP coverage session because it was not started.
    post:
      tags:
      - agents
      summary: Stops the active CTP coverage session in this environment for the given
        user.
      description: Stops the active CTP coverage session in this environment for the
        given user ID.
      operationId: stopSessionPost
      parameters:
      - name: environmentId
        in: path
        description: Unique environment identifier
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSessionStopModelV3"
      responses:
        "200":
          description: The active CTP coverage session was stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatusModelV3"
        "401":
          description: User does not have permissions to modify environment.
        "403":
          description: License does not have Environment Management enabled.
        "404":
          description: Unknown environment ID.
        "409":
          description: Cannot stop CTP coverage session because it was not started.
  /v3/environments/{environmentId}/agents/test/stop:
    get:
      tags:
      - agents
      summary: Stops a test and returns the current status.
      description: "Stops an in-progress test in the active CTP coverage session in\
        \ this environment for the given user ID and returns the current status. If\
        \ parallel ID was used to start the test, then it must be specified when stopping\
        \ the test."
      operationId: stopTestGet
      parameters:
      - name: environmentId
        in: path
        description: Unique environment identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: query
        description: User ID
        schema:
          type: string
      - name: parallelId
        in: query
        description: Parallel ID
        schema:
          type: string
      - name: id
        in: query
        description: Test ID
        schema:
          type: string
      - name: result
        in: query
        description: Test result
        schema:
          type: string
          description: The result of a test.
          xml:
            name: TestResultModelV3
          enum:
          - PASS
          - FAIL
          - INCOMPLETE
      - name: message
        in: query
        description: Result message
        schema:
          type: string
      responses:
        "200":
          description: The test was stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatusModelV3"
        "400":
          description: Test ID is missing or invalid.
        "401":
          description: User does not have permissions to modify environment.
        "403":
          description: License does not have Environment Management enabled.
        "404":
          description: Unknown environment ID or no coverage agent is associated with
            the active CTP coverage session.
        "405":
          description: Using user ID or parallel ID in single user mode is not allowed.
        "409":
          description: No CTP coverage session is in progress.
        "424":
          description: Cannot connect to coverage agent or coverage agent returned
            an error.
    post:
      tags:
      - agents
      summary: Stops a test and returns the current status.
      description: "Stops an in-progress test in the active CTP coverage session in\
        \ this environment for the given user ID and returns the current status. If\
        \ parallel ID was used to start the test, then it must be specified when stopping\
        \ the test."
      operationId: stopTestPost
      parameters:
      - name: environmentId
        in: path
        description: Unique environment identifier
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: "JSON containing the test ID, optional test case ID, user ID,\
          \ optional parallel ID, test result, and result message. DTP will display\
          \ the test case ID as the test name when specified."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTestStopModelV3"
      responses:
        "200":
          description: The test was stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatusModelV3"
        "400":
          description: Test ID is missing or invalid.
        "401":
          description: User does not have permissions to modify environment.
        "403":
          description: License does not have Environment Management enabled.
        "404":
          description: Unknown environment ID or no coverage agent is associated with
            the active CTP coverage session.
        "405":
          description: Using user ID or parallel ID in single user mode is not allowed.
        "409":
          description: No CTP coverage session is in progress.
        "424":
          description: Cannot connect to coverage agent or coverage agent returned
            an error.
  /v3/environments/{environmentId}/agents/test/stop/{testId}:
    get:
      tags:
      - agents
      summary: Stops a test and returns the current status.
      description: "Stops an in-progress test in the active CTP coverage session in\
        \ this environment for the given user ID and returns the current status. If\
        \ parallel ID was used to start the test, then it must be specified when stopping\
        \ the test."
      operationId: stopTestGetById
      parameters:
      - name: environmentId
        in: path
        description: Unique environment identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: query
        description: User ID
        schema:
          type: string
      - name: parallelId
        in: query
        description: Parallel ID
        schema:
          type: string
      - name: testId
        in: path
        description: Test ID
        required: true
        schema:
          type: string
      - name: result
        in: query
        description: Test result
        schema:
          type: string
          description: The result of a test.
          xml:
            name: TestResultModelV3
          enum:
          - PASS
          - FAIL
          - INCOMPLETE
      - name: message
        in: query
        description: Result message
        schema:
          type: string
      responses:
        "200":
          description: The test was stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatusModelV3"
        "400":
          description: Test ID is missing or invalid.
        "401":
          description: User does not have permissions to modify environment.
        "403":
          description: License does not have Environment Management enabled.
        "404":
          description: Unknown environment ID or no coverage agent is associated with
            the active CTP coverage session.
        "405":
          description: Using user ID or parallel ID in single user mode is not allowed.
        "409":
          description: No CTP coverage session is in progress.
        "424":
          description: Cannot connect to coverage agent or coverage agent returned
            an error.
  /v3/environments/{environmentId}/components/{id}:
    delete:
      tags:
      - components
      summary: Remove a component from the environment.
      description: "Remove a component, specified by id, from the environment. Deletes\
        \ any component instances no longer referenced by any environment."
      operationId: deleteComponent
      parameters:
      - name: environmentId
        in: path
        description: Unique environment identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: id
        in: path
        description: Unique component identifier in the environment
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Operation successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentInfoModelV3"
        "404":
          description: Environment does not exist.
  /v3/environments/{environmentId}/components/{componentId}/config:
    get:
      tags:
      - components
      summary: Get either JSON or YAML configuration for a component.
      description: "Get either JSON or YAML configuration for the component with the\
        \ specified id in the environment. Note that currently only name, description,\
        \ id, ctpWebsocketUrl, ctpSubscriptionQueue, tags, and instances are supported\
        \ for components; and only name, description, and coverage settings are supported\
        \ for instances."
      operationId: getComponentConfig
      parameters:
      - name: environmentId
        in: path
        description: Unique environment identifier
        required: true
        schema:
          type: integer
          format: int64
      - name: componentId
        in: path
        description: Unique component identifier in the environment
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Operation successful.
          content:
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/ComponentExportModelV3"
              examples:
                Cloud Component Example:
                  summary: Example CTP component YAML
                  description: "An example of the YAML accepted by CTP for a given\
                    \ component. In this case, the component has two instances, one\
                    \ of which has the information provided for a coverage agent.\
                    \ The component itself also has two tags. Note that null/empty\
                    \ fields may be provided as either null/empty or left out of the\
                    \ YAML altogether when provided as a Request Body, and that field\
                    \ order may differ from that of the schema since YAML fields within\
                    \ a dictionary are unordered."
                  value: |-
                    name: Cloud
                    description: This component represents an interchangeable source of cloud-based resources.
                    tags:
                    - CloudComponentTag
                    - CoudProvider
                    instances:
                    - name: CloudProviderA
                      description: Represents a cloud-based resource provider.
                    - name: CloudProviderB
                      description: An alternative representation of a cloud-based resource provider.
                      coverage:
                        agentUrl: http://localhost:8050
                        dtpProject: myproject
                        dtpFilter: myproject
                        buildId: latest
                        coverageImages: coverageImageA
                        agentMode: CTP_TO_AGENT
                Default:
                  summary: Default Swagger-generated component YAML
                  description: The default example automatically generated by Swagger
                    UI.
                  value: |-
                    name: string
                    description: string
                    tags:
                      - string
                    instances:
                      - name: string
                        description: string
                        coverage:
                          agentUrl: string
                          dtpProject: string
                          dtpFilter: string
                          buildId: string
                          coverageImages: string
                          agentMode: string
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentExportModelV3"
              examples:
                Cloud Component Example:
                  summary: Example CTP component JSON
                  description: "An example of JSON accepted by CTP for a given component.\
                    \ In this case, the component has two instances, one of which\
                    \ has the information provided for a coverage agent. The component\
                    \ itself also has two tags."
                  value: |-
                    {
                      "name": "Cloud",
                      "description": "This component represents an interchangeable source of cloud-based resources.",
                      "tags": [
                        "CloudComponentTag",
                        "CoudProvider"
                      ],
                      "instances": [
                        {
                          "description": "Represents a cloud-based resource provider.",
                          "name": "CloudProviderA"
                        },
                        {
                          "coverage": {
                            "agentUrl": "http://localhost:8050",
                            "dtpProject": "myproject",
                            "dtpFilter": "myproject",
                            "buildId": "latest",
                            "coverageImages": "coverageImageA"
                            "agentMode": "CTP_TO_AGENT"
                          },
                          "description": "An alternative representation of a cloud-based resource provider.",
                          "name": "CloudProviderB"
                        }
                      ]
                    }
                Default:
                  summary: Default Swagger-generated component JSON
                  description: The default example automatically generated by Swagger
                    UI.
                  value: |-
                    {
                      "name": "string",
                      "description": "string",
                      "tags": [
                        "string"
                      ],
                      "instances": [
                        {
                          "name": "string",
                          "description": "string",
                          "coverage": {
                            "agentUrl": "string",
                            "dtpProject": "string",
                            "dtpFilter": "string",
                            "buildId": "string",
                            "coverageImages": "string"
                            "agentMode": "CTP_TO_AGENT"
                          }
                        }
                      ]
                    }
        "404":
          description: Component or Environment does not exist.
    put:
      tags:
      - components
      summary: Upload JSON or YAML configuration for a component.
