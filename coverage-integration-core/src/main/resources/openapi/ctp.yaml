        content:
          multipart/form-data:
            schema:
              required:
              - file
              - serverId
              type: object
              properties:
                file:
                  $ref: "#/components/schemas/FormDataContentDisposition"
                serverId:
                  type: integer
                  description: The unique ID of a registered Virtualize server where
                    the assets should be deployed
                  format: int64
                dataRepositoryConnectionMode:
                  type: string
                  description: Connection mode (HOST_PORT or CONNECTION_STRING) to
                    use with the target data repository server
                  default: HOST_PORT
                dataRepositoryConnectionString:
                  type: string
                  description: Target data repository server connection string for
                    importing repositories with the system
                dataRepositoryHost:
                  type: string
                  description: Target data repository server host for importing repositories
                    with the system
                dataRepositoryPort:
                  type: integer
                  description: Target data repository server port for importing repositories
                    with the system
                  format: int32
                dataRepositoryUsername:
                  type: string
                  description: Username for authenticating with the target data repository
                    server
                dataRepositoryPassword:
                  type: string
                  description: Password for authenticating with the target data repository
                    server
                dataRepositorySSL:
                  type: boolean
                  description: Use SSL to connect to target data repository server
      responses:
        "200":
          description: Operation completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemModelV1"
        "400":
          description: Bad request error is returned if the content parameter is missing.
        "401":
          description: Unauthorized error is returned if the server security has been
            configured and the Authorization header is not present in the request
            or does not match a user with an EM access role.
        "403":
          description: License does not have Environment Management enabled
        "404":
          description: Not found error is returned if the server ID does not match
            any registered Virtualize server.
        "424":
          description: Failed dependency error is returned if the target server is
            offline.
