name: Publish Javadoc

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Javadoc
        run: mvn -B -pl coverage-integration-api -am package

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Javadoc
        uses: actions/upload-pages-artifact@v3
        with:
          path: coverage-integration-api/target/reports/apidocs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
